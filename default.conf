map $sent_http_content_type $cache_policy {
    default                 "no-cache";
    ~^image/                "public, max-age=604800";
    ~^video/                "public, max-age=604800";
    ~^font/                 "public, max-age=604800";
    application/pdf         "no-cache";
}

# Consumer site. Requests for getotoli.com get the Otoli consumer page at "/".
# Everything else (privacy, terms, 404s) is shared with the main server below.
server {
    listen       80;
    server_name  getotoli.com www.getotoli.com;
    root         /usr/share/nginx/html;
    index        index.html;

    error_page 404 /otoli/404.html;

    add_header Cache-Control $cache_policy always;

    location = / {
        try_files /otoli/index.html =404;
    }

    location /otoli/ {
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location = /privacy { try_files /privacy.html =404; }
    location = /terms   { try_files /terms.html =404; }

    location = /otoli/404.html {
        internal;
    }

    # Investor materials are not served on the consumer domain.
    location / {
        return 404;
    }
}

server {
    listen       80 default_server;
    server_name  _;
    # Default server: vestibrum.com and anything not matched above.
    root         /usr/share/nginx/html;
    index        index.html;

    # Branded 404. error_page preserves the 404 status code -- unknown paths
    # return a real "not found" to browsers and crawlers, not a soft 200.
    error_page 404 /404.html;

    add_header Cache-Control $cache_policy always;

    # Static-site routing: extensionless URLs resolve to their .html file
    # (/privacy -> /privacy.html, /terms -> /terms.html). Anything that does
    # not exist on disk falls through to the branded 404 above.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Serve the 404 page itself without recursing back through try_files.
    location = /404.html {
        internal;
    }

    # Unlisted investor brief. Not linked from the homepage and not listed in
    # robots.txt (listing it there would advertise the URL). Kept out of search
    # indexes via the header below plus a matching <meta name="robots"> tag.
    location = /2-pager {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cache-Control $cache_policy always;
        try_files /2-pager.html =404;
    }

    location = /otoli-investor-brief.pdf {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control $cache_policy always;
        try_files $uri =404;
    }
}
