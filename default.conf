server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Branded 404. error_page preserves the 404 status code -- unknown paths
    # return a real "not found" to browsers and crawlers, not a soft 200.
    error_page 404 /404.html;

    # Static-site routing: extensionless URLs resolve to their .html file
    # (/privacy -> /privacy.html, /terms -> /terms.html). Anything that does
    # not exist on disk falls through to the branded 404 above.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Serve the 404 page itself without recursing back through try_files.
    location = /404.html {
        internal;
    }

    # Unlisted investor brief. Not linked from the homepage and not listed in
    # robots.txt (listing it there would advertise the URL). Kept out of search
    # indexes via the header below plus a matching <meta name="robots"> tag.
    location = /2-pager {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        try_files /2-pager.html =404;
    }

    location = /otoli-investor-brief.pdf {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }
}
