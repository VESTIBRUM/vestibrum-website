server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Extensionless URLs: /privacy -> /privacy.html, /terms -> /terms.html.
    # Any unknown path falls back to the branded homepage instead of a raw
    # nginx "404 Not Found".
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Unlisted investor brief. Not linked from the homepage and not listed in
    # robots.txt (listing it there would advertise the URL). Kept out of search
    # indexes via the header below plus a matching <meta name="robots"> tag.
    location = /2-pager {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        try_files /2-pager.html =404;
    }

    location = /otoli-investor-brief.pdf {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri =404;
    }
}
